name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          set +e
          yes | sdkmanager --licenses
          set -e
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: home
          path: home.apk
          if-no-files-found: error

      - name: Publish sideload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv
          name: Home
          body: |
            Sideload `home.apk` on Google TV or Android TV.
            It is signed with the CI debug key, which is enough for a personal launcher.
            Replacing this release replaces the file at the same download URL.
          files: home.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
